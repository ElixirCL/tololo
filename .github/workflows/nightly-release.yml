name: Create Nightly Release

on:
  # This can be used to automatically publish nightlies at UTC nighttime
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC
  # This can be used to allow manually triggering nightlies from the web interface
  workflow_dispatch:

jobs:
  nightly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Latest Commit Date
        id: check_commit_date
        run: |
          # Get the latest commit date in ISO 8601 format
          LATEST_COMMIT_DATE=$(git log -1 --format=%cI)

          # Convert the latest commit date and the current date to seconds since epoch
          LATEST_COMMIT_SECONDS=$(date --date="$LATEST_COMMIT_DATE" +%s)
          CURRENT_DATE_SECONDS=$(date +%s)

          # Calculate the time difference in seconds
          TIME_DIFF=$((CURRENT_DATE_SECONDS - LATEST_COMMIT_SECONDS))

          # Check if the difference is greater than 24 hours (86400 seconds)
          if [ $TIME_DIFF -lt 86400 ]; then
            echo "RECENT_COMMIT=true" >> "$GITHUB_ENV"
          fi
      
      - name: Create Nightly Release
        if: $RECENT_COMMIT == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # generate a unique tag for nightly release
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          TAG_NAME="nightly-$TIMESTAMP"

          # create a release
          # https://docs.github.com/en/rest/releases/releases?apiVersion=2022-11-28
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{
              "tag_name": "'$TAG_NAME'",
              "target_commitish": "main",
              "name": "Nightly Build '$TIMESTAMP'",
              "body": "Automated nightly release from main branch.",
              "draft": false,
              "prerelease": true
            }'
